version: '3.8'

services:
  postgres:
    image: postgres:17.9-alpine
    container_name: ai-logger-postgres
    environment:
      POSTGRES_USER: ailogger
      POSTGRES_PASSWORD: ailogger
      POSTGRES_DB: ailogger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ailogger"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-logger-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://ailogger:ailogger@postgres:5432/ailogger
      - API_PORT=3001
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - CORS_ORIGIN=http://localhost:3000
      - AI_PROVIDER=${AI_PROVIDER:-google}
      - AI_MODEL=${AI_MODEL:-gemini-2.0-flash}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/node_modules
    command: pnpm --filter api dev

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: ai-logger-dashboard
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - api
    volumes:
      - ./apps/dashboard:/app/apps/dashboard
      - ./packages:/app/packages
      - /app/node_modules
    command: pnpm --filter dashboard dev

volumes:
  postgres_data:
